<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#070b15">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Deutsch Dice — Learn & Defend</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="./css/main.css"><link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
<div id="app">
  <div id="screen-home" class="screen active"></div>
  <div id="screen-collection" class="screen"></div>
  <div id="screen-trial" class="screen"></div>
  <div id="screen-rewards" class="screen"></div>
  <div id="game-container" class="screen">
    <div class="battle-hud">
      <button id="btn-back-home" class="hud-back">←</button>
      <div id="wave-info" class="hud-pill">⚔️ 1/3</div>
      <div class="hud-spacer"></div>
      <div id="heart-hp" class="hud-pill">❤️ 100</div>
      <div id="battle-coins" class="hud-pill">🪙 100</div>
    </div>
    <div class="game-hint">Вибери картку → натисни клітинку. Дві однакові карти одного рівня можна об’єднати.</div>
    <div class="game-controls">
      <div id="battle-hand" class="hand"></div>
      <button id="roll-btn" class="roll-btn">ROLL<small>🪙 10</small></button>
    </div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
