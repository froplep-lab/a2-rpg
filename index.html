<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Random Deutsch Cards</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/ui.css">
</head>
<body>
  <div id="app">
    <div id="screen-home" class="screen active"></div>
    <div id="screen-collection" class="screen"></div>
    <div id="screen-trial" class="screen"></div>
    <div id="screen-rewards" class="screen"></div>
    <div id="game-container" class="screen">
      <div id="battle-hud">
        <button id="btn-back-home" class="btn-secondary">🏠 Home</button>
        <div id="wave-info">Wave: 1/3</div>
        <div id="heart-hp">❤️ 100</div>
      </div>
    </div>
    <div id="perf-monitor" class="perf-panel">FPS: 60 | Entities: 0</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
