<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <!-- Мета-теги для коректного відображення в Telegram (заборона зуму) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DE B1 RPG Studio</title>
    
    <!-- Обов'язкове підключення Telegram WebApp API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* Темна тема та мінімалістичний RPG стиль (таверна/фентезі) */
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --tavern-wood: #2d241c;
            --border-color: #4a3b2c;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .game-container {
            background-color: var(--tavern-wood);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #d1d5db;
        }

        /* Арена для майбутніх анімацій (стікмени/бої) */
        #battle-arena {
            margin: 20px 0;
            height: 150px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px dashed #555;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 0.9rem;
        }

        /* Елемент для виводу статусу завантаження слів */
        #status-message {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 28px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>DE B1 RPG Studio</h1>
        
        <div id="battle-arena">
            Тут буде RPG арена
        </div>

        <!-- Саме сюди app.js виводить повідомлення про успіх або 0 слів -->
        <div id="status-message">Ініціалізація Telegram...</div>
    </div>

    <!-- КРИТИЧНО: підключення скрипта як модуля (type="module") -->
    <script type="module" src="app.js"></script>
</body>
</html>
